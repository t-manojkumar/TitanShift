<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TitanShift</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="app">
    <!-- Title bar -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <div class="app-logo">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M2 9L9 2L16 9L9 16L2 9Z" stroke="#e8ff47" stroke-width="1.5"/>
            <path d="M5 9L9 5L13 9L9 13L5 9Z" fill="#e8ff47"/>
          </svg>
        </div>
        <span class="app-name">TITANSHIFT</span>
        <span class="app-version">v1.0</span>
      </div>
      <div class="titlebar-drag" id="drag-region"></div>
      <div class="titlebar-right">
        <button class="tb-btn" id="btn-minimize" title="Minimize">─</button>
        <button class="tb-btn" id="btn-maximize" title="Maximize">□</button>
        <button class="tb-btn tb-close" id="btn-close" title="Close">✕</button>
      </div>
    </div>

    <div class="main-layout">
      <!-- LEFT: Operation panel -->
      <div class="panel-left">
        <div class="section-label">OPERATION</div>

        <!-- Mode selector -->
        <div class="mode-bar">
          <button class="mode-btn active" data-mode="copy">COPY</button>
          <button class="mode-btn" data-mode="move">MOVE</button>
          <button class="mode-btn" data-mode="rename">RENAME</button>
          <button class="mode-btn danger" data-mode="delete">DELETE</button>
        </div>

        <!-- Source -->
        <div class="field-group">
          <div class="field-label">SOURCE</div>
          <div class="drop-zone" id="drop-zone-src">
            <div class="dz-inner">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3 7V15H17V7" stroke="currentColor" stroke-width="1.2"/>
                <path d="M7 3H13L17 7H3L7 3Z" stroke="currentColor" stroke-width="1.2"/>
                <path d="M10 10V16M10 10L7 13M10 10L13 13" stroke="#e8ff47" stroke-width="1.2"/>
              </svg>
              <span>Drop files/folders or click to browse</span>
            </div>
          </div>
          <div class="file-list" id="src-list"></div>
          <div class="field-actions">
            <button class="btn-sm" id="btn-add-files">+ Files</button>
            <button class="btn-sm" id="btn-add-folder">+ Folder</button>
            <button class="btn-sm danger-sm" id="btn-clear-src">Clear</button>
          </div>
        </div>

        <!-- Destination (hidden for delete) -->
        <div class="field-group" id="dest-group">
          <div class="field-label">DESTINATION</div>
          <div class="dest-row">
            <div class="dest-path" id="dest-display">—</div>
            <button class="btn-sm" id="btn-pick-dest">Browse</button>
          </div>
        </div>

        <!-- Rename field (hidden unless rename mode) -->
        <div class="field-group hidden" id="rename-group">
          <div class="field-label">NEW NAME</div>
          <input class="text-input" id="rename-input" type="text" placeholder="new_filename.ext"/>
          <div class="hint">For multiple files: name_0.ext, name_1.ext…</div>
        </div>

        <!-- Run button -->
        <button class="run-btn" id="btn-run">
          <span id="run-btn-text">RUN OPERATION</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2L11 7L3 12V2Z" fill="currentColor"/>
          </svg>
        </button>

        <!-- Logs -->
        <div class="section-label" style="margin-top:16px">LOGS</div>
        <div class="log-panel" id="log-panel"></div>
      </div>

      <!-- RIGHT: Dashboard -->
      <div class="panel-right">
        <div class="section-label">LIVE DASHBOARD</div>

        <!-- Progress area -->
        <div class="progress-card" id="progress-card">
          <div class="progress-top">
            <div class="status-badge" id="status-badge">IDLE</div>
            <div class="progress-meta" id="progress-meta">—</div>
          </div>
          <div class="current-file" id="current-file">No operation running</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <span class="progress-pct" id="progress-pct">0%</span>
          </div>
          <div class="ctrl-row">
            <button class="ctrl-btn" id="btn-cancel" disabled>CANCEL</button>
            <button class="ctrl-btn accent" id="btn-pause" disabled>PAUSE</button>
          </div>
        </div>

        <!-- Live graph -->
        <div class="section-label" style="margin-top:16px">THROUGHPUT</div>
        <div class="graph-card">
          <canvas id="graph-canvas" width="600" height="140"></canvas>
          <div class="graph-legend">
            <span class="leg read">▸ READ</span>
            <span class="leg write">▸ WRITE</span>
          </div>
        </div>

        <!-- Metrics row -->
        <div class="metrics-row">
          <div class="metric-card" id="mc-cpu">
            <div class="metric-label">CPU</div>
            <div class="metric-ring-wrap">
              <svg class="ring" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="24" class="ring-bg"/>
                <circle cx="30" cy="30" r="24" class="ring-fill" id="cpu-ring" style="stroke-dasharray:0 151"/>
              </svg>
              <div class="metric-val" id="cpu-val">0%</div>
            </div>
            <div class="metric-sub" id="cpu-sub">—</div>
          </div>
          <div class="metric-card" id="mc-mem">
            <div class="metric-label">MEMORY</div>
            <div class="metric-ring-wrap">
              <svg class="ring" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="24" class="ring-bg"/>
                <circle cx="30" cy="30" r="24" class="ring-fill mem" id="mem-ring" style="stroke-dasharray:0 151"/>
              </svg>
              <div class="metric-val" id="mem-val">0%</div>
            </div>
            <div class="metric-sub" id="mem-sub">—</div>
          </div>
          <div class="metric-card" id="mc-disk">
            <div class="metric-label">DISK</div>
            <div class="disk-bars">
              <div class="disk-bar-row">
                <span class="disk-lbl">R</span>
                <div class="disk-track"><div class="disk-fill read" id="disk-read-bar" style="width:0%"></div></div>
                <span class="disk-num" id="disk-read-val">0</span>
              </div>
              <div class="disk-bar-row">
                <span class="disk-lbl">W</span>
                <div class="disk-track"><div class="disk-fill write" id="disk-write-bar" style="width:0%"></div></div>
                <span class="disk-num" id="disk-write-val">0</span>
              </div>
              <div class="disk-unit">MB/s</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
